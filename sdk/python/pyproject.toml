[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perps-sdk"
version = "0.1.0"
description = "Python SDK for the Perps on-chain perpetual futures exchange (UNAUDITED local prototype)"
requires-python = ">=3.10"
dependencies = [
  "web3==8.0.0",
  "eth-account==0.14.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
perps_sdk = ["abi/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
