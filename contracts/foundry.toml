[profile.default]
src = "src"
test = "foundry-test"
out = "out-forge"
cache_path = "cache-forge"
libs = ["node_modules", "lib"]
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
]
solc_version = "0.8.24"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
# EIP-170 limit enforced (default); do not set allow_unlimited_contract_size
code_size_limit = 24576
fs_permissions = [{ access = "read", path = "./out-forge" }, { access = "read-write", path = "./cache-forge" }]
bytecode_hash = "none"
ffi = false

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 250
fail_on_revert = false
show_metrics = true

[profile.ci.fuzz]
runs = 2000
[profile.ci.invariant]
runs = 256
depth = 200
