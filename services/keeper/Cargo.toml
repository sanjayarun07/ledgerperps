[package]
name = "perp-keeper"
version = "0.1.0"
edition = "2021"
publish = false
description = "Independent permissionless keeper for the Perps exchange (UNAUDITED prototype)"

[lib]
name = "perp_keeper"
path = "src/lib.rs"

[[bin]]
name = "perp-keeper"
path = "src/main.rs"

[dependencies]
alloy = { version = "=2.5.0", default-features = false, features = ["std", "json-rpc", "eips", "provider-http", "reqwest", "rpc-types", "signer-local", "signer-keystore", "sol-types", "contract", "network", "consensus", "rpc-client"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "fs"] }
tokio-util = "=0.7.20"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=1.2.1"
clap = { version = "=4.6.7", features = ["derive", "env"] }
prometheus-client = "=0.26.0"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
anyhow = "=1.0.104"
thiserror = "=2.0.21"
tower = { version = "=0.5.3", default-features = false }

[dev-dependencies]
tempfile = "=3.27.0"
rand = "=0.8.8"
