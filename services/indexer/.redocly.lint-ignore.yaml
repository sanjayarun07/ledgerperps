# This file instructs Redocly's linter to ignore the rules contained for specific parts of your API.
# See https://redocly.com/docs/cli/ for more information.
# /v1/ws: the successful response of a WebSocket handshake is 101 Switching Protocols, which is not a 2XX; declaring a
# fake 200 would be false documentation, so this one operation is exempted from operation-2xx-response.
docs/openapi.yaml:
  operation-2xx-response:
    - '#/paths/~1v1~1ws/get/responses'
