{{- if .Values.externalSecrets.enabled }}
# Secret VALUES live in the external secret manager. These objects only reference them.
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata: { name: perps-keeper }
spec:
  refreshInterval: 1h
  secretStoreRef: {{ toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target: { name: perps-keeper }
  data:
    - secretKey: KEEPER_PRIVATE_KEY   # ASSUMED env name; prefer KMS/HSM signer over a raw key
      remoteRef: { key: {{ .Values.externalSecrets.keeperKeyRemoteRef | quote }} }
---
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata: { name: perps-indexer }
spec:
  refreshInterval: 1h
  secretStoreRef: {{ toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target: { name: perps-indexer }
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: {{ .Values.externalSecrets.databaseUrlRemoteRef | quote }} }
    - secretKey: REDIS_URL
      remoteRef: { key: {{ .Values.externalSecrets.redisUrlRemoteRef | quote }} }
{{- end }}
